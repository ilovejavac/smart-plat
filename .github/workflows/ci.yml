name: Build and Publish

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Maven project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build
        run: >-
          mvn -B -ntp -T 1C
          -Dmaven.javadoc.skip=true
          -Dmaven.source.skip=true
          clean package

      - name: Upload application JARs
        uses: actions/upload-artifact@v4
        with:
          name: application-jars
          path: |
            auth-manage/target/auth-manage-*.jar
            data-manage/target/data-manage-*.jar
            document-hub/target/document-hub-*.jar
          if-no-files-found: error
          retention-days: 1

  docker:
    name: Docker ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: auth-manage
            image: smart-auth
          - module: data-manage
            image: smart-data
          - module: document-hub
            image: smart-document
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download application JARs
        uses: actions/download-artifact@v4
        with:
          name: application-jars
          path: .

      - name: Resolve application JAR
        id: jar
        shell: bash
        run: |
          jar="$(find "${{ matrix.module }}/target" -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            ! -name '*.original' | head -n 1)"
          if [ -z "$jar" ]; then
            echo "::error::No application JAR found for ${{ matrix.module }}"
            exit 1
          fi
          echo "path=$jar" >> "$GITHUB_OUTPUT"
          echo "Using $jar"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          build-args: |
            JAR_FILE=${{ steps.jar.outputs.path }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
